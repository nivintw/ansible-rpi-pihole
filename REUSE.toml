version = 1

# .gitignore stays in hawkeye's default excludes (not re-included via a negation) and is
# licensed here instead of via an inline header.
[[annotations]]
path = ".gitignore"
SPDX-FileCopyrightText = "© 2024 Tyler Nivin"
SPDX-License-Identifier = "MIT"

# The favicon is a graphic asset, not a text file hawkeye can header inline.
[[annotations]]
path = "docs/assets/favicon.svg"
SPDX-FileCopyrightText = "© 2024 Tyler Nivin"
SPDX-License-Identifier = "MIT"


# The issue-form templates: GitHub's issue-form parser silently rejects a form whose YAML
# begins with a comment (falling back to a blank issue), so these must start with the form
# keys and can't carry an inline SPDX header — hawkeye is told to skip them (see
# .config/licenserc.toml) and they're licensed here instead.
[[annotations]]
path = ".github/ISSUE_TEMPLATE/**"
SPDX-FileCopyrightText = "© 2024 Tyler Nivin"
SPDX-License-Identifier = "MIT"

# The Claude Code guard hooks ship verbatim from the template (no per-file templating), so they
# carry no inline SPDX header and are excluded from hawkeye (see .config/licenserc.toml) —
# licensed here instead.
[[annotations]]
path = ".claude/hooks/**"
SPDX-FileCopyrightText = "© 2024 Tyler Nivin"
SPDX-License-Identifier = "MIT"

# Files that can't carry an SPDX header (no comment syntax / generated). Everything
# else gets a real header from hawkeye (see .config/licenserc.toml).
[[annotations]]
path = ["**/*.json", "**/.vscode/*"]
SPDX-FileCopyrightText = "© 2024 Tyler Nivin"
SPDX-License-Identifier = "MIT"

# Pre-existing project content hawkeye can't header inline:
#   - Jinja templates (.j2): an inserted comment would land in the rendered output.
#   - group_vars/*/vars: extensionless YAML, so hawkeye maps no comment style.
#   - inventory.yaml.example: extensionless-style (.example) sample, likewise unmapped.
#   - roles' bundled config/data files (*.conf, the unbound-run launcher): dropped verbatim
#     into the container, so they carry no SPDX header of their own.
#   - the architecture .drawio: an XML diagram document, not headerable source.
[[annotations]]
path = [
  "roles/**/templates/*.j2",
  "group_vars/**/vars",
  "inventory.yaml.example",
  "roles/**/files/**/*.conf",
  "roles/**/files/**/unbound-run",
  "ansible-rpi-pihole-architecture.drawio",
]
SPDX-FileCopyrightText = "© 2024 Tyler Nivin"
SPDX-License-Identifier = "MIT"
