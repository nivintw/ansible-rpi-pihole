---
# Galaxy content this project depends on, installed by `ansible-galaxy install -r requirements.yml`
# (into Ansible's default path, where ansible-lint resolves it). `ansible.builtin.*` is always
# available and needs no entry here.
collections:
  # General-purpose modules/filters used across the plays.
  - name: community.general

  # Personal baseline collection (hosts the shared role config this project builds on).
  - name: git@github.com:nivintw/ansible-rpi-nivintw-baseline.git
    version: main
    type: git

  # Podman container/image management.
  - name: containers.podman

roles: []
