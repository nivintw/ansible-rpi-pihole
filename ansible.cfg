# Ansible configuration. Galaxy content from requirements.yml installs to Ansible's default
# path (~/.ansible/collections) — where ansible-lint, Molecule, and ansible-playbook all resolve
# it without a relative path that Molecule's ephemeral runs can't follow.
#
# This project keeps its inventory in ./inventory.yaml (copy inventory.yaml.example → and
# keep it out of git — see .gitignore) and its role under ./roles. interpreter_python=auto
# lets Ansible discover the remote Python rather than pinning a path.
[defaults]
roles_path = ./roles
inventory = ./inventory.yaml
interpreter_python = auto
